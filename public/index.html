<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaunchPad</title>
<meta name="description" content="LaunchPad helps independent Roblox developers find what's holding their game back and what to improve next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css?v=__V_CSS__">
</head>
<body class="booting">
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
  <div class="scrim" id="scrim"></div>
  <div style="min-width:0">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar"></button>
      <a class="brand" href="#/home" id="topBrand"></a>
      <span id="topAcct"></span>
    </header>
    <main class="main" id="main" tabindex="-1">
      <div id="storageBanner"></div>
      <div id="view" class="view"></div>
    </main>
  </div>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="/app.js?v=__V_JS__"></script>
</body>
</html>
