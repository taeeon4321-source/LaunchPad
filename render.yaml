# Render Blueprint: one web service + one Postgres database. Secrets are set in the Render dashboard (sync: false).
services:
  - type: web
    name: launchpad
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase: { name: launchpad-db, property: connectionString }
      - key: DATABASE_SSL
        value: "off" # internal Render network
      - key: ENCRYPTION_KEY
        generateValue: false
        sync: false
      - { key: APP_ORIGIN, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: PADDLE_ENV, sync: false }
      - { key: PADDLE_API_KEY, sync: false }
      - { key: PADDLE_CLIENT_TOKEN, sync: false }
      - { key: PADDLE_WEBHOOK_SECRET, sync: false }
      - { key: PADDLE_PRODUCT_LIGHT, sync: false }
      - { key: PADDLE_PRODUCT_MAX, sync: false }
      - { key: PADDLE_PRICE_LIGHT_MONTHLY, sync: false }
      - { key: PADDLE_PRICE_LIGHT_ANNUAL, sync: false }
      - { key: PADDLE_PRICE_MAX_MONTHLY, sync: false }
      - { key: PADDLE_PRICE_MAX_ANNUAL, sync: false }
      - key: PAST_DUE_GRACE_DAYS
        value: "0"
      - key: PLAN_LIMITS_JSON
        value: '{"light":{"connected_experiences":2,"monthly_scans":30,"sync_interval_minutes":1440},"max":{"connected_experiences":20,"monthly_scans":1000,"sync_interval_minutes":60}}'
      - { key: EMAIL_PROVIDER, value: outbox }
databases:
  - name: launchpad-db
    plan: basic-256mb
